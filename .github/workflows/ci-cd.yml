name: Build, Test & Deploy to Google Cloud Run

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  CLOUD_RUN_SERVICE: apex-institutional-ledger
  IMAGE: ghcr.io/anandnavanee/fde
  GCP_PROJECT_ID: slabspro-slabsuser45

jobs:
  test:
    name: Type-check, build, and validate Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Validate Docker build
        run: docker build --tag apex-institutional-ledger:ci .

  publish:
    name: Publish container image
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy frontend to Cloud Run
    if: ${{ needs.publish.result == 'success' && vars.DEPLOY_TO_CLOUD_RUN == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_TAG" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --port 8080 \
            --memory 256Mi \
            --max 3 \
            --allow-unauthenticated \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          {
            echo "### Cloud Run deployment complete"
            echo
            echo "| Service | Region | URL |"
            echo "| --- | --- | --- |"
            echo "| \`$CLOUD_RUN_SERVICE\` | \`$GCP_REGION\` | [$SERVICE_URL]($SERVICE_URL) |"
          } >> "$GITHUB_STEP_SUMMARY"
